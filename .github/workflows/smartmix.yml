name: SmartMix core tests
on:
  push:
    paths: ["SmartMixCore/**", "CMakeLists.txt", ".github/workflows/smartmix.yml"]
  pull_request:
    paths: ["SmartMixCore/**", "CMakeLists.txt", ".github/workflows/smartmix.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
