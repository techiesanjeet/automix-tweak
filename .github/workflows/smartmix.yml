name: SmartMix core tests

concurrency:
  group: smartmix-tests-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    paths: ["SmartMixCore/src/**", "SmartMixCore/include/**", "SmartMixCore/tests/**", "CMakeLists.txt"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
