name: iOS Theos build

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["**"]
    paths:
      - "AutoMixEngine.mm"
      - "BeatThisCoreML.mm"
      - "BetaSourceProcessorProbe.mm"
      - "Makefile"
      - ".github/workflows/ios-build.yml"
      - "control"
      - "layout/**"
      - "SmartMixCore/src/**"
      - "SmartMixCore/include/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Cache converted Beat This Core ML model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: model-build/BeatThisSmall0.mlpackage
          key: beat-this-small0-6074be2c4d490c5f6101fcc374a1ec72ae93456e23bb6019783b849f5dc7d47b-torch250-coremltools830-v1

      - name: Set up Python
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check out pinned Beat This source
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none https://github.com/CPJKU/beat_this.git beat_this_upstream
          git -C beat_this_upstream fetch --depth=1 origin b95c8ab0c58c2d9fcfd40508ae8dffbc05ac4f5c
          git -C beat_this_upstream checkout --detach FETCH_HEAD

      - name: Install model conversion dependencies
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" "torch==2.5.0" "torchaudio==2.5.0" "coremltools==8.3.0" einops rotary-embedding-torch soxr

      - name: Download pinned Beat This checkpoint
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p model-build
          curl --fail --location --retry 3 \
            "https://cloud.cp.jku.at/public.php/dav/files/7ik4RrBKTS273gp/small0.ckpt" \
            --output model-build/small0.ckpt

      - name: Convert and verify Core ML model
        if: steps.model-cache.outputs.cache-hit != 'true'
        env:
          PYTHONPATH: beat_this_upstream
        run: |
          python tools/export_beat_this_coreml.py \
            --checkpoint model-build/small0.ckpt \
            --expected-sha256 6074be2c4d490c5f6101fcc374a1ec72ae93456e23bb6019783b849f5dc7d47b \
            --output model-build/BeatThisSmall0.mlpackage

      - name: Compile model and prepare Theos resources
        run: |
          set -euo pipefail
          mkdir -p model-build/compiled Resources
          xcrun coremlcompiler compile \
            model-build/BeatThisSmall0.mlpackage model-build/compiled
          test -d model-build/compiled/BeatThisSmall0.mlmodelc
          rm -rf Resources/BeatThisSmall0.mlmodelc
          cp -R model-build/compiled/BeatThisSmall0.mlmodelc Resources/BeatThisSmall0.mlmodelc

      - name: Cache Theos and SDKs
        uses: actions/cache@v4
        with:
          path: theos
          key: ${{ runner.os }}-theos-sdk-master-v1

      - name: Install Theos and iOS SDKs
        uses: Randomblock1/theos-action@v1

      - name: Build rootful arm64 diagnostic package
        run: |
          set -euo pipefail
          make clean
          make messages=yes package
          ROOTFUL_DEB="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$ROOTFUL_DEB"
          mkdir -p "$RUNNER_TEMP/automix-packages"
          cp "$ROOTFUL_DEB" "$RUNNER_TEMP/automix-packages/AutoMixEngine-rootful.deb"

      - name: Build rootless arm64 diagnostic package
        run: |
          set -euo pipefail
          THEOS_PACKAGE_SCHEME=rootless make clean
          THEOS_PACKAGE_SCHEME=rootless make messages=yes package
          ROOTLESS_DEB="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$ROOTLESS_DEB"
          cp "$ROOTLESS_DEB" "$RUNNER_TEMP/automix-packages/AutoMixEngine-rootless.deb"

      - name: Verify packages and local model bundle
        run: |
          set -euo pipefail
          brew install dpkg
          for DEB in "$RUNNER_TEMP"/automix-packages/*.deb; do
            test -s "$DEB"
            dpkg-deb --info "$DEB"
            CONTENTS="$(dpkg-deb --contents "$DEB")"
            printf '%s\n' "$CONTENTS"
            echo "$CONTENTS" | grep -q 'AutoMixEngine.dylib'
            echo "$CONTENTS" | grep -q 'AutoMixEngine.plist'
            echo "$CONTENTS" | grep -q 'BeatThisSmall0.mlmodelc'
          done
          DYLIB="$(find . -type f -name 'AutoMixEngine.dylib' -print -quit)"
          BUNDLE="$(find . -type d -name 'SmartMixResources.bundle' -print -quit)"
          test -n "$DYLIB"
          test -n "$BUNDLE"
          test -d "$BUNDLE/BeatThisSmall0.mlmodelc"
          file "$DYLIB"
          xcrun --sdk iphoneos lipo -info "$DYLIB" || lipo -info "$DYLIB"
          cp "$DYLIB" "$RUNNER_TEMP/automix-packages/AutoMixEngine.dylib"
          cp -R "$BUNDLE" "$RUNNER_TEMP/automix-packages/SmartMixResources.bundle"

      - name: Upload installable packages and raw build
        uses: actions/upload-artifact@v4
        with:
          name: AutoMixEngine-ios-arm64-packages-and-CoreML
          path: ${{ runner.temp }}/automix-packages
          if-no-files-found: error
          retention-days: 14
