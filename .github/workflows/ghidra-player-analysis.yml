name: Targeted Spotify ARM64 player-reference scan

on:
  push:
    branches: [analysis/ghidra-player-path]
    paths:
      - "tools/targeted_macho_xrefs.py"
      - ".github/workflows/ghidra-player-analysis.yml"
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "MediaFire share URL or direct IPA URL"
        required: true
        type: string
        default: "https://www.mediafire.com/file/f2m6phjgdhtpyen/Taurus-0.60.6.ipa/file?dkey=10sos8x35xg&r=957"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download and unpack supplied IPA
        env:
          IPA_URL: ${{ inputs.ipa_url || 'https://www.mediafire.com/file/f2m6phjgdhtpyen/Taurus-0.60.6.ipa/file?dkey=10sos8x35xg&r=957' }}
        run: python3 tools/analyze_ipa.py
      - name: Scan only ARM64 player and transition references
        run: python3 tools/targeted_macho_xrefs.py
      - name: Upload targeted scan and IPA inventory
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Spotify-Targeted-Player-Xrefs
          path: |
            analysis-output/targeted-player-xrefs.txt
            analysis-output/REPORT.md
            analysis-output/binary-inventory.tsv
            analysis-output/keyword-hits.txt
            analysis-output/automix-symbols.txt
            analysis-output/swift-symbols-demangled.txt
          if-no-files-found: warn
          retention-days: 14

