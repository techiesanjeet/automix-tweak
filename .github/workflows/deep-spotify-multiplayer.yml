name: Deep Spotify multiplayer analysis

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct IPA URL or MediaFire share URL"
        required: true
        type: string
        default: "https://www.mediafire.com/file/f2m6phjgdhtpyen/Taurus-0.60.6.ipa/file?dkey=10sos8x35xg&r=957"

permissions:
  contents: read

jobs:
  deep-scan:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download and unpack IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: python3 tools/analyze_ipa.py
      - name: Inspect Spotify and SpotifyShared symbols and strings
        run: python3 tools/deep_analyze_spotify.py
      - name: Disassemble multiplayer playback methods
        run: python3 tools/disassemble_multiplayer_methods.py
      - name: Inspect Objective-C runtime method lists and IMPs
        run: python3 tools/scan_objc_runtime_methods.py
      - name: Trace transition service direct callees
        run: python3 tools/trace_transition_service_calls.py
      - name: Upload analysis only (never the IPA)
        uses: actions/upload-artifact@v4
        with:
          name: Spotify-MultiPlayer-Deep-Analysis
          path: |
            analysis-output/spotify-multiplayer-deep-scan.txt
            analysis-output/Spotify.nm.txt
            analysis-output/Spotify.swift-demangled.txt
            analysis-output/SpotifyShared.nm.txt
            analysis-output/SpotifyShared.swift-demangled.txt
            analysis-output/spotify-multiplayer-method-index.txt
            analysis-output/spotify-multiplayer-method-disassembly.txt
            analysis-output/spotify-multiplayer-methods-error.txt
            analysis-output/spotify-objc-runtime-full.txt
            analysis-output/spotify-objc-runtime-target-contexts.txt
            analysis-output/spotify-objc-imp-disassembly.txt
            analysis-output/spotify-transition-service-call-trace.txt
          if-no-files-found: warn
          retention-days: 7
