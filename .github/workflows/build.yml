name: Build Spotify AutoMix Targeted Discovery Diagnostic v4
on:
  push:
    branches:
      - diagnostics/spotify-playback-discovery-v4
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install ldid xz
      - name: Install Theos
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
      - name: Install iOS SDKs
        run: |
          mkdir -p "$THEOS/sdks"
          curl -fL https://github.com/theos/sdks/archive/master.zip -o sdks.zip
          mkdir -p sdk-temp
          ditto -x -k sdks.zip sdk-temp
          find sdk-temp -type d -name "*.sdk" -prune -exec mv {} "$THEOS/sdks/" \;
          rm -rf sdks.zip sdk-temp
          ls -la "$THEOS/sdks"
      - name: Verify toolchain
        run: |
          test -d "$THEOS"
          test -n "$(find "$THEOS/sdks" -name '*.sdk' -print -quit)"
      - name: Build diagnostic dylib
        run: |
          make clean || true
          make
      - name: Upload diagnostic dylib
        uses: actions/upload-artifact@v4
        with:
          name: AutoMixDiscovery-v4-dylib
          path: .theos/obj/debug/*.dylib
          if-no-files-found: error
