name: Build AutoMixEngine Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install ldid
        run: brew install ldid

      - name: Install Theos & SDKs Safely
        run: |
          git clone https://github.com/theos/theos.git ~/theos
          # Initialize submodules safely inside the user directory without permission issues
          cd ~/theos && git submodule update --init --recursive
          
          # Download official iOS SDKs
          curl -sL https://github.com/theos/sdks/archive/master.zip -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp/
          mv /tmp/sdks-master/*.sdk ~/theos/sdks/

      - name: Build Dylib
        env:
          THEOS: /Users/runner/theos
        run: |
          make

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoMixEngine-dylib
          path: |
            .theos/obj/debug/*.dylib
            obj/*.dylib
