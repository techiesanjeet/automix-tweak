name: Build AutoMixEngine Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies & Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make git ldid
          git clone --recursive https://github.com/theos/theos.git ~/theos

      - name: Build Dylib
        run: |
          export THEOS=~/theos
          make
        env:
          THEOS: /home/runner/theos

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoMixEngine-dylib
          path: |
            .theos/obj/debug/*.dylib
            obj/*.dylib
