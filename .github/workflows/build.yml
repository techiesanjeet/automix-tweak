name: Build AutoMixEngine Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Dependencies & Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot git perl clang llvm lld make curl unzip
          
          # Install ldid code-signing utility
          curl -sL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 -o /tmp/ldid
          chmod +x /tmp/ldid
          sudo mv /tmp/ldid /usr/local/bin/ldid

          # Clone Theos non-recursively to avoid submodule issues
          git clone https://github.com/theos/theos.git ~/theos

          # Run the official Theos installer script to set up compilers/toolchain
          ~/theos/bin/install-theos -f

          # Download official iOS SDKs
          curl -sL https://github.com/theos/sdks/archive/master.zip -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp/
          mv /tmp/sdks-master/*.sdk ~/theos/sdks/

      - name: Build Dylib
        env:
          THEOS: /home/runner/theos
        run: |
          make

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoMixEngine-dylib
          path: |
            .theos/obj/debug/*.dylib
            obj/*.dylib
