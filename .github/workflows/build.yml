name: Build AutoMixEngine Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install ldid
        run: brew install ldid

      - name: Install Theos & SDKs Locally
        run: |
          git clone https://github.com/theos/theos.git theos
          
          # Download official iOS SDKs
          curl -sL https://github.com/theos/sdks/archive/master.zip -o sdks.zip
          unzip -q sdks.zip -d ./
          mv sdks-master/*.sdk theos/sdks/
          rm sdks.zip

      - name: Build Dylib
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          make

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoMixEngine-dylib
          path: |
            .theos/obj/debug/*.dylib
            obj/*.dylib
